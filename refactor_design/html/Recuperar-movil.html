<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3E4D43; text-wrap: balance;">Escribe el correo de tu cuenta para recibir un enlace de recuperación.</p>
</div>
<section aria-label="Formulario de recuperación" style="box-sizing: border-box; padding: 24px; background: #FFFFFF; border: 1px solid #DCE5D2; border-radius: 24px;">

<input id="recuperar-correo" type="email" autocomplete="email" inputmode="email" maxlength="255" placeholder="tu@email.com" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px 0 48px; border-radius: 12px; border: 1px solid #CBD6C0; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #1D2B22;">
</div>
</div>
<button type="submit" style="margin-top: 4px; width: 100%; box-sizing: border-box; height: 52px; border-radius: 999px; background: #2F6B45; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700; border: 0; font-family: inherit; cursor: pointer;">Enviar enlace de recuperación
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
<a href="Acceso-movil.html" style="align-self: center; min-height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #2F6B45; text-decoration: none;">

<span style="text-decoration: underline; text-underline-offset: 4px;">Volver a iniciar sesión</span></a>
